<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Seixo: convite</title>
<!--
  The page a Seixo invite link opens when the app is not installed yet.

  No scripts from anywhere else, no analytics, no cookies, no forms. The
  invite code is in the part of the address after "#", which the browser
  keeps to itself: GitHub serves this page without ever receiving it. The
  script below only reads it here, to build the "open in Seixo" button.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F1EC; --surface: #FFFFFF; --border: #DDD6CB;
    --text: #2B2A27; --sub: #6B6558; --accent: #CC785C; --on-accent: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262624; --surface: #30302E; --border: #47463F; --text: #F2EFE9; --sub: #B3ADA0; --accent: #DA9179; --on-accent: #1F1E1C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 48px 20px 40px; }
  .brand { color: var(--accent); font-weight: 600; letter-spacing: .02em; margin: 0 0 6px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; }
  .lead { color: var(--sub); margin: 0 0 28px; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  li { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .n { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 13px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; margin-right: 8px; }
  .btn { display: block; text-align: center; margin-top: 12px; padding: 13px; border-radius: 12px; font-weight: 600; text-decoration: none; background: var(--accent); color: var(--on-accent); }
  .btn.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .note { color: var(--sub); font-size: 14px; margin-top: 24px; }
  .bad { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="brand">Seixo</p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>

  <ol id="steps">
    <li><span class="n">1</span><span id="s1"></span>
      <a class="btn secondary" id="store" href="https://apps.apple.com/app/id6799254811"></a></li>
    <li><span class="n">2</span><span id="s2"></span></li>
    <li><span class="n">3</span><span id="s3"></span>
      <a class="btn" id="open" href="#"></a></li>
  </ol>

  <div class="bad" id="invalid" hidden></div>
  <p class="note" id="android"></p>
  <p class="note" id="privacy"></p>
</main>
<script>
(function () {
  var T = {
    pt: {
      title: 'Convidaram-te para o Seixo',
      lead: 'Mensagens privadas, sem número de telefone, sem email, sem nome.',
      s1: 'Instala o Seixo.', store: 'Abrir na App Store',
      s2: 'Abre a app e cria a tua conta. Demora segundos.',
      s3: 'Volta a esta página e abre o convite:', open: 'Abrir o convite no Seixo',
      invalid: 'Este link está incompleto. Pede a quem to enviou que o volte a enviar.',
      android: 'Por agora, o Seixo só existe para iPhone.',
      privacy: 'O código do convite está na parte do link depois de «#», que o teu navegador nunca envia a nenhum servidor. Esta página não tem rastreio nem cookies.'
    },
    en: {
      title: "You've been invited to Seixo",
      lead: 'Private messages, with no phone number, no email, no name.',
      s1: 'Install Seixo.', store: 'Open in the App Store',
      s2: 'Open the app and create your account. It takes seconds.',
      s3: 'Come back to this page and open the invite:', open: 'Open the invite in Seixo',
      invalid: 'This link is incomplete. Ask whoever sent it to send it again.',
      android: 'For now, Seixo is only available for iPhone.',
      privacy: 'The invite code is in the part of the link after "#", which your browser never sends to any server. This page has no tracking and no cookies.'
    },
    es: {
      title: 'Te han invitado a Seixo',
      lead: 'Mensajes privados, sin número de teléfono, sin email, sin nombre.',
      s1: 'Instala Seixo.', store: 'Abrir en la App Store',
      s2: 'Abre la app y crea tu cuenta. Tarda segundos.',
      s3: 'Vuelve a esta página y abre la invitación:', open: 'Abrir la invitación en Seixo',
      invalid: 'Este enlace está incompleto. Pide a quien te lo envió que lo vuelva a enviar.',
      android: 'Por ahora, Seixo solo está disponible para iPhone.',
      privacy: 'El código de la invitación está en la parte del enlace después de «#», que tu navegador nunca envía a ningún servidor. Esta página no tiene rastreo ni cookies.'
    }
  };
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
  var lang = 'en';
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i]).slice(0, 2).toLowerCase();
    if (T[l]) { lang = l; break; }
  }
  var t = T[lang];
  document.documentElement.lang = lang;
  ['title', 'lead', 's1', 'store', 's2', 's3', 'open', 'invalid', 'android', 'privacy'].forEach(function (k) {
    document.getElementById(k).textContent = t[k];
  });

  var code = (location.hash || '').replace(/^#/, '');
  if (/^[A-Za-z0-9_-]{16,64}$/.test(code)) {
    document.getElementById('open').href = 'seixo://invite#' + code;
  } else {
    document.getElementById('steps').hidden = true;
    document.getElementById('invalid').hidden = false;
  }
})();
</script>
</body>
</html>
